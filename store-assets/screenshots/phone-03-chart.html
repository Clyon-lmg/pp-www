<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=390"/>
<title>Peptide Planner — Serum Levels</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 390px; height: 844px; overflow: hidden;
    background: #020617;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    color: #F1F5F9;
    -webkit-font-smoothing: antialiased;
  }
  .status-bar {
    height: 50px;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 24px 10px;
    font-size: 15px; font-weight: 600;
  }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .app-header {
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid #1E293B;
  }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #0D9488, #0284C7);
    display: flex; align-items: center; justify-content: center;
  }
  .header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }

  .content { padding: 16px 20px 0; }

  /* Time range tabs */
  .range-tabs {
    display: flex; gap: 6px; margin-bottom: 14px;
  }
  .rtab {
    font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 20px;
    border: 1px solid #334155;
    color: #64748B; cursor: pointer;
  }
  .rtab.active {
    background: rgba(22,163,140,0.18); border-color: rgba(22,163,140,0.4);
    color: #16A38C;
  }

  /* Legend */
  .legend {
    display: flex; align-items: center; gap: 16px; margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #94A3B8; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* Chart canvas container */
  .chart-box {
    background: #0A1628;
    border: 1px solid #1E293B; border-radius: 16px;
    padding: 12px 10px 10px;
    margin-bottom: 16px;
  }
  canvas { display: block; }

  /* Today marker label */
  .today-marker-label {
    text-align: center; margin-bottom: 6px;
    font-size: 10px; color: #475569; letter-spacing: 0.4px;
  }

  /* Compound detail cards */
  .compound-cards { display: flex; flex-direction: column; gap: 10px; }
  .c-card {
    background: #0F172A; border: 1px solid #1E293B; border-radius: 14px;
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .c-left { display: flex; align-items: center; gap: 10px; }
  .c-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .c-name { font-size: 14px; font-weight: 700; }
  .c-meta { font-size: 11px; color: #64748B; margin-top: 2px; }
  .c-level {
    text-align: right;
  }
  .c-level-val { font-size: 15px; font-weight: 700; }
  .c-level-label { font-size: 10px; color: #64748B; text-transform: uppercase; letter-spacing: 0.4px; }

  .nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 82px;
    background: #060F1E; border-top: 1px solid #1E293B;
    display: flex; justify-content: space-around; align-items: center;
    padding-bottom: 20px;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 500; color: #475569; width: 60px;
  }
  .nav-item.active { color: #16A38C; }
  .home-indicator {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px;
  }
</style>
</head>
<body>

<!-- Status Bar -->
<div class="status-bar">
  <span>9:41</span>
  <div class="status-icons">
    <svg width="16" height="12" viewBox="0 0 16 12" fill="white">
      <rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="4" y="5" width="3" height="7" rx="0.5"/>
      <rect x="8" y="2" width="3" height="10" rx="0.5"/><rect x="12" y="0" width="3" height="12" rx="0.5"/>
    </svg>
    <svg width="16" height="12" viewBox="0 0 24 18" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round">
      <path d="M1 6 C5.5 1 18.5 1 23 6"/><path d="M5 10.5 C7.5 7.5 16.5 7.5 19 10.5"/>
      <path d="M9 15 C10.2 13.5 13.8 13.5 15 15"/><circle cx="12" cy="18" r="1.2" fill="white" stroke="none"/>
    </svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
      <rect x="0" y="1" width="22" height="10" rx="2.5" stroke="white" stroke-width="1.5"/>
      <rect x="1.5" y="2.5" width="18" height="7" rx="1.5" fill="white"/>
      <path d="M23 4v4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<!-- App Header -->
<div class="app-header">
  <div class="logo-icon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/>
      <path d="M8.5 2h7"/><path d="M7 16h10"/>
    </svg>
  </div>
  <span class="header-title">Serum Levels</span>
  <div style="width:34px;color:#64748B;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="4" y1="6" x2="11" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="13" y2="18"/>
      <circle cx="14" cy="6" r="3"/><circle cx="23" cy="12" r="3"/>
    </svg>
  </div>
</div>

<div class="content">

  <!-- Time range tabs -->
  <div class="range-tabs">
    <div class="rtab">7d</div>
    <div class="rtab active">21d + 14d</div>
    <div class="rtab">90d</div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#16A38C"></div>BPC-157</div>
    <div class="legend-item"><div class="legend-dot" style="background:#0EA5E9"></div>TB-500</div>
    <div class="legend-item"><div class="legend-dot" style="background:#D946EF"></div>Retatrutide</div>
  </div>

  <!-- Chart container -->
  <div class="chart-box">
    <canvas id="chart" width="330" height="200"></canvas>
  </div>

  <!-- Compound detail cards -->
  <div class="compound-cards">
    <div class="c-card">
      <div class="c-left">
        <div class="c-dot" style="background:#16A38C"></div>
        <div>
          <div class="c-name">BPC-157</div>
          <div class="c-meta">t½ 3 h · 250 mcg daily</div>
        </div>
      </div>
      <div class="c-level">
        <div class="c-level-val" style="color:#16A38C">185 mcg</div>
        <div class="c-level-label">Est. now</div>
      </div>
    </div>
    <div class="c-card">
      <div class="c-left">
        <div class="c-dot" style="background:#0EA5E9"></div>
        <div>
          <div class="c-name">TB-500</div>
          <div class="c-meta">t½ 48 h · 500 mcg EOD</div>
        </div>
      </div>
      <div class="c-level">
        <div class="c-level-val" style="color:#0EA5E9">342 mcg</div>
        <div class="c-level-label">Est. now</div>
      </div>
    </div>
    <div class="c-card">
      <div class="c-left">
        <div class="c-dot" style="background:#D946EF"></div>
        <div>
          <div class="c-name">Retatrutide</div>
          <div class="c-meta">t½ 167 h · 2 mg weekly</div>
        </div>
      </div>
      <div class="c-level">
        <div class="c-level-val" style="color:#D946EF">1.6 mg</div>
        <div class="c-level-label">Est. now</div>
      </div>
    </div>
  </div>

</div>

<!-- Bottom Nav -->
<div class="nav">
  <div class="nav-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    Today
  </div>
  <div class="nav-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    Calendar
  </div>
  <div class="nav-item active">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16A38C" stroke-width="2" stroke-linecap="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    Chart
  </div>
  <div class="nav-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
    </svg>
    Stock
  </div>
  <div class="nav-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    More
  </div>
  <div class="home-indicator"></div>
</div>

<script>
// ── Serum Level Chart ──
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const W = canvas.width;   // 330
const H = canvas.height;  // 200

const ML = 44, MR = 10, MT = 10, MB = 32;
const CW = W - ML - MR;  // 276
const CH = H - MT - MB;  // 158

const TOTAL_DAYS = 35;       // 21 history + 14 projection
const TODAY_DAY  = 21;       // day index of "now"
const SAMPLES_PER_DAY = 8;   // sample resolution
const TOTAL_SAMPLES = TOTAL_DAYS * SAMPLES_PER_DAY;
const TODAY_IDX = TODAY_DAY * SAMPLES_PER_DAY;

// Peptide simulation: returns array of normalized [0,1] concentrations
function simulate(halfLifeHours, doseIntervalDays, doseAmount, firstDoseDay) {
  const lambda = Math.LN2 / halfLifeHours;
  const dtHours = 24 / SAMPLES_PER_DAY;
  const conc = new Array(TOTAL_SAMPLES).fill(0);

  for (let d = firstDoseDay; d < TOTAL_DAYS; d += doseIntervalDays) {
    // Dose given at 8am on day d
    const doseIdx = Math.round((d * 24 + 8) / dtHours);
    for (let t = doseIdx; t < TOTAL_SAMPLES; t++) {
      conc[t] += doseAmount * Math.exp(-lambda * (t - doseIdx) * dtHours);
    }
  }
  return conc;
}

// Normalize to [0, 1]
function norm(arr) {
  const max = Math.max(...arr.slice(0, TODAY_IDX + SAMPLES_PER_DAY));
  return max > 0 ? arr.map(v => Math.min(v / max, 1.1)) : arr;
}

const bpc = norm(simulate(3,   1,  250,  0));   // BPC-157:     3h half-life, daily
const tb5 = norm(simulate(48,  2,  500,  0));   // TB-500:     48h half-life, every 2 days
const ret = norm(simulate(167, 7, 2000,  0));   // Retatrutide: ~7d half-life, weekly

// Coordinate helpers
function xPos(sampleIdx) { return ML + (sampleIdx / (TOTAL_SAMPLES - 1)) * CW; }
function yPos(v)          { return MT + CH - v * CH; }

// Background
ctx.fillStyle = '#0A1628';
ctx.fillRect(0, 0, W, H);

// Grid lines (horizontal)
ctx.strokeStyle = 'rgba(30,41,59,0.8)';
ctx.lineWidth = 1;
[0.25, 0.5, 0.75, 1.0].forEach(v => {
  const y = yPos(v);
  ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(ML + CW, y); ctx.stroke();
});

// Y-axis labels
ctx.fillStyle = '#334155';
ctx.font = '9px -apple-system, BlinkMacSystemFont, sans-serif';
ctx.textAlign = 'right';
['100%', '75%', '50%', '25%', '0'].forEach((label, i) => {
  const v = 1 - i * 0.25;
  ctx.fillText(label, ML - 4, yPos(v) + 3);
});

// X-axis day labels (every 7 days)
ctx.fillStyle = '#334155';
ctx.textAlign = 'center';
ctx.font = '9px -apple-system, BlinkMacSystemFont, sans-serif';
for (let d = 0; d <= TOTAL_DAYS; d += 7) {
  const x = xPos(d * SAMPLES_PER_DAY);
  const label = d === TODAY_DAY ? 'Today' : (d < TODAY_DAY ? `-${TODAY_DAY - d}d` : `+${d - TODAY_DAY}d`);
  ctx.fillStyle = d === TODAY_DAY ? '#16A38C' : '#334155';
  ctx.fillText(label, x, H - MB + 14);
}

// Clip chart area
ctx.save();
ctx.rect(ML, MT, CW, CH);
ctx.clip();

// Draw area fills (very subtle)
function drawFill(data, color, toIdx) {
  ctx.beginPath();
  ctx.moveTo(xPos(0), yPos(0));
  for (let i = 0; i <= toIdx; i++) { ctx.lineTo(xPos(i), yPos(data[i])); }
  ctx.lineTo(xPos(toIdx), yPos(0));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

drawFill(bpc, 'rgba(22,163,140,0.07)', TODAY_IDX);
drawFill(tb5, 'rgba(14,165,233,0.06)', TODAY_IDX);
drawFill(ret, 'rgba(217,70,239,0.05)', TODAY_IDX);

// Draw curves (history = solid, projection = dashed)
function drawCurve(data, color) {
  // History (solid)
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  for (let i = 0; i <= TODAY_IDX; i++) {
    const x = xPos(i), y = yPos(data[i]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Projection (dashed)
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 3]);
  ctx.globalAlpha = 0.65;
  for (let i = TODAY_IDX; i < TOTAL_SAMPLES; i++) {
    const x = xPos(i), y = yPos(data[i]);
    i === TODAY_IDX ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.setLineDash([]);
}

drawCurve(bpc, '#16A38C');
drawCurve(tb5, '#0EA5E9');
drawCurve(ret, '#D946EF');

ctx.restore();

// Today vertical line
const todayX = xPos(TODAY_IDX);
ctx.beginPath();
ctx.strokeStyle = 'rgba(22,163,140,0.5)';
ctx.lineWidth = 1.5;
ctx.setLineDash([3, 3]);
ctx.moveTo(todayX, MT);
ctx.lineTo(todayX, MT + CH);
ctx.stroke();
ctx.setLineDash([]);

// "Now" label on today line
ctx.fillStyle = 'rgba(22,163,140,0.85)';
ctx.font = 'bold 9px -apple-system, sans-serif';
ctx.textAlign = 'center';
ctx.fillText('NOW', todayX, MT + 9);

// Axes border
ctx.strokeStyle = '#1E293B';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(ML, MT); ctx.lineTo(ML, MT + CH); ctx.lineTo(ML + CW, MT + CH);
ctx.stroke();
</script>

</body>
</html>
